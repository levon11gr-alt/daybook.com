
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daybook — Календарь-дневник</title>
<style>
:root {
  --bg: #f4f6fb;
  --panel: #ffffff;
  --text: #182033;
  --muted: #788197;
  --line: #e7eaf1;
  --accent: #5b67f1;
  --accent-light: #eef0ff;
  --green: #1e9b70;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Arial, sans-serif;
}
button, input, textarea { font: inherit; }
button { cursor: pointer; }

.app { max-width: 1200px; margin: auto; padding: 25px; }
.topbar {
  display: flex; justify-content: space-between;
  align-items: center; gap: 15px; margin-bottom: 25px;
}
.brand { display: flex; align-items: center; gap: 12px; }
  
.topbar { position: relative; }

.menu-button {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: white;
  color: var(--text);
  font-size: 23px;
}

.side-menu {
  display: none;
  position: absolute;
  top: 52px;
  left: 0;
  z-index: 20;
  width: 190px;
  padding: 8px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 13px;
  box-shadow: 0 10px 30px #1d28501c;
}

.side-menu.open { display: flex; flex-direction: column; gap: 5px; }

.side-menu button {
  padding: 12px;
  text-align: left;
  border: 0;
  border-radius: 8px;
  background: white;
  color: var(--text);
}

.side-menu button:hover { background: var(--accent-light); }

.logo {
  background: var(--accent); color: white;
  border-radius: 13px; width: 45px; height: 45px;
  display: grid; place-items: center; font-size: 24px;
  font-weight: bold;
}
h1 { font-size: 23px; margin: 0; }
.subtitle { color: var(--muted); font-size: 13px; margin-top: 5px; }
.primary {
  background: var(--accent); color: white; border: 0;
  padding: 12px 16px; border-radius: 11px; font-weight: 600;
}
.layout {
  display: grid; grid-template-columns: 1.5fr 1fr;
  gap: 20px; align-items: start;
}
.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 18px; padding: 22px;
  box-shadow: 0 10px 30px #1d28500c;
}
.cal-head, .side-head {
  display: flex; justify-content: space-between;
  align-items: center; gap: 12px; margin-bottom: 20px;
}
.month-title { font-size: 22px; font-weight: 750; }
.navs { display: flex; gap: 6px; }
.navs button, .today-btn {
  background: white; border: 1px solid var(--line);
  border-radius: 9px; padding: 8px 12px;
}
.weekdays, .days {
  display: grid; grid-template-columns: repeat(7, minmax(0,1fr));
  gap: 6px;
}
.weekday {
  text-align: center; font-size: 11px; color: var(--muted);
  font-weight: bold; padding: 8px 0;
}
.day {
  min-height: 78px; text-align: left; vertical-align: top;
  padding: 9px 7px; border: 1px solid transparent;
  border-radius: 10px; background: #fafbfe; color: var(--text);
}
.day:hover { border-color: #cbd0ff; }
.day.outside { opacity: .35; }
.day.selected { background: var(--accent-light); border-color: var(--accent); }
.day.today .num {
  display: inline-grid; place-items: center;
  background: var(--accent); color: white;
  width: 25px; height: 25px; border-radius: 8px;
}
.num { font-size: 13px; font-weight: bold; }
.dots { display: flex; gap: 4px; margin-top: 10px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.dot.done-dot { background: var(--green); }

.side-head h2 { font-size: 19px; margin: 0; }
.side-head p { font-size: 12px; color: var(--muted); margin: 5px 0 0; }
.add-small {
  border: 0; border-radius: 9px; width: 38px; height: 38px;
  color: var(--accent); background: var(--accent-light); font-size: 22px;
}
.task-list { display: flex; flex-direction: column; gap: 10px; }
.task {
  display: flex; align-items: flex-start; gap: 10px;
  border: 1px solid var(--line); padding: 12px; border-radius: 12px;
}
.task input[type=checkbox] { margin-top: 3px; accent-color: var(--green); }
.task-main { flex: 1; min-width: 0; }
.task-title { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
.task.done .task-title { text-decoration: line-through; color: #9aa2b2; }
.task-meta {
  white-space: pre-wrap; overflow-wrap: anywhere;
  font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.5;
}
.task-actions { display: flex; gap: 4px; }
.mini-btn { background: transparent; border: 0; color: var(--muted); padding: 4px; }
.empty { text-align: center; padding: 35px 10px; color: var(--muted); }
.empty strong { display: block; color: var(--text); margin-bottom: 6px; }

.overlay {
  display: none; position: fixed; inset: 0; z-index: 5;
  background: #11182b77; padding: 15px;
  align-items: center; justify-content: center;
}
.overlay.show { display: flex; }
.modal {
  background: white; width: min(100%, 480px); max-height: 92vh;
  overflow-y: auto; padding: 24px; border-radius: 18px;
}
.modal-head {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 20px;
}
.modal-head h2 { font-size: 21px; margin: 0; }
.close {
  border: 0; border-radius: 8px; width: 33px; height: 33px;
  background: #f1f3f8; font-size: 20px;
}
.field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 15px; }
.field label { font-size: 13px; font-weight: 650; }
.field input, .field textarea {
  width: 100%; border: 1px solid #dfe3ec;
  border-radius: 10px; padding: 11px; outline: none;
}
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { min-height: 80px; resize: vertical; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.reminder {
  display: flex; align-items: center; gap: 10px;
  background: #f7f8fc; border: 1px solid var(--line);
  padding: 12px; border-radius: 10px; font-size: 13px;
}
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.secondary {
  background: white; border: 1px solid var(--line);
  padding: 11px 15px; border-radius: 10px;
}
.toast {
  display: none; position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%); z-index: 10;
  background: #182033; color: white; padding: 12px 17px;
  border-radius: 10px; font-size: 13px;
}
.toast.show { display: block; }

@media(max-width: 800px) {
  .layout { grid-template-columns: 1fr; }
}
@media(max-width: 500px) {
  .app { padding: 12px; }
  .panel { padding: 13px; }
  .day { min-height: 52px; padding: 6px 4px; }
  .today-btn { display: none; }
  .two-col { gap: 8px; }
  .topbar .primary { padding: 10px; font-size: 12px; }
}
</style>
  
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2563eb">

</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      
    <button class="menu-button" id="menuButton" type="button" aria-label="Открыть меню">☰</button>
    <nav class="side-menu" id="sideMenu">
      <button type="button" id="homePageButton">🏠 Главная</button>
      <button type="button" id="ideasPageButton">💡 Идеи</button>
    </nav>

      <div class="logo">D</div>
      <div>
        <h1>Daybook</h1>
        <div class="subtitle">Твой календарь. Твои планы.</div>
      </div>
    </div>
    <button class="primary" id="newTaskTop">＋ Новая задача</button>
  </header>

<section id="ideasPage" class="panel" style="display:none; margin-bottom:20px;">
  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
    <div>
      <h2>💡 Мои идеи</h2>
      <p class="subtitle">Записывай мысли, сохраняй вдохновение.</p>
    </div>
    <button class="primary" id="addIdeaButton">＋ Новая идея</button>
  </div>

  <div id="ideasList" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-top:20px;"></div>

  <div id="ideaEditor" style="display:none; margin-top:20px; padding:16px; border:1px solid var(--line); border-radius:14px;">
    <h3 id="ideaEditorTitle">Новая идея</h3>
    <input id="ideaTitle" placeholder="Название идеи" style="width:100%; padding:12px; margin-bottom:10px;">
    <textarea id="ideaText" placeholder="Запиши свою идею..." rows="5" style="width:100%; padding:12px; resize:vertical;"></textarea>

    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;">
      <label class="primary" style="display:inline-flex; align-items:center; cursor:pointer;">
        🖼️ Добавить фото
        <input id="ideaImageInput" type="file" accept="image/*" multiple hidden>
      </label>
      <button type="button" id="drawIdeaButton">✏️ Рисовать</button>
    </div>

    <div id="ideaImagesPreview" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;"></div>

    <div id="ideaDrawingArea" style="display:none; margin-top:12px;">
      <p class="subtitle">Рисуй пальцем или мышкой.</p>
      <canvas id="ideaCanvas" width="700" height="350" style="width:100%; border:1px solid var(--line); border-radius:10px; touch-action:none; background:white;"></canvas>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="button" id="clearIdeaDrawing">Очистить рисунок</button>
        <button type="button" id="saveIdeaDrawing">Сохранить рисунок</button>
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;">
      <button class="primary" id="saveIdeaButton">Сохранить идею</button>
      <button type="button" id="cancelIdeaButton">Отмена</button>
    </div>
  </div>
</section>

  <main class="layout">
    
    <section class="panel">
      <div class="cal-head">
        <div class="month-title" id="monthTitle"></div>
        <div class="navs">
          <button id="prevMonth">‹</button>
          <button id="nextMonth">›</button>
          <button class="today-btn" id="todayBtn">Сегодня</button>
        </div>
      </div>
      <div class="weekdays">
        <div class="weekday">ПН</div><div class="weekday">ВТ</div>
        <div class="weekday">СР</div><div class="weekday">ЧТ</div>
        <div class="weekday">ПТ</div><div class="weekday">СБ</div>
        <div class="weekday">ВС</div>
      </div>
      <div class="days" id="daysGrid"></div>
      <div class="subtitle" style="text-align:center;margin-top:16px">
        Нажми на дату, чтобы посмотреть задачи
      </div>
    </section>

    <aside class="panel">
      <div class="side-head">
        <div>
          <h2 id="selectedTitle">Планы на сегодня</h2>
          <p id="selectedSubtitle"></p>
        </div>
        <button class="add-small" id="addTask">＋</button>
      </div>
      <div class="task-list" id="taskList"></div>
    </aside>
  </main>
</div>

<div class="overlay" id="taskOverlay">
  <form class="modal" id="taskForm">
    <div class="modal-head">
      <h2 id="modalTitle">Новая задача</h2>
      <button type="button" class="close" id="closeModal">×</button>
    </div>
    <div class="field">
      <label for="taskName">Название задачи *</label>
      <input id="taskName" maxlength="100" required placeholder="Например, тренировка">
    </div>
    <div class="two-col">
      <div class="field">
        <label for="taskDate">Дата *</label>
        <input id="taskDate" type="date" required>
      </div>
      <div class="field">
        <label for="taskTime">Время</label>
        <input id="taskTime" type="time">
      </div>
    </div>
    <div class="field">
      <label for="taskNote">Заметка</label>
      <textarea id="taskNote" maxlength="1000" placeholder="Дополнительные подробности..."></textarea>
    </div>
    <label class="reminder">
      <input type="checkbox" id="taskReminder">
      <span>Напомнить о задаче (если браузер поддерживает уведомления)</span>
    </label>
    <div class="modal-actions">
      <button type="button" class="secondary" id="cancelModal">Отмена</button>
      <button type="submit" class="primary">Сохранить</button>
    </div>
  </form>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const months = ['Январь','Февраль','Март','Апрель','Май','Июнь',
'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const weekdays = ['воскресенье','понедельник','вторник','среда',
'четверг','пятница','суббота'];
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDate = s => {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y,m-1,d,12);
};
const today = keyOf(new Date());
let selectedDate = today;
let viewDate = new Date();
let editingId = null;
let tasks = [];

try {
  tasks = JSON.parse(localStorage.getItem('daybook_tasks') || '[]');
  if (!Array.isArray(tasks)) tasks = [];
} catch { tasks = []; }

function save() {
  localStorage.setItem('daybook_tasks', JSON.stringify(tasks));
}
function toast(message) {
  const el = $('toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove('show'), 2600);
}
function renderCalendar() {
  $('monthTitle').textContent =
    months[viewDate.getMonth()] + ' ' + viewDate.getFullYear();
  const first = new Date(viewDate.getFullYear(),viewDate.getMonth(),1);
  const offset = (first.getDay()+6)%7;
  const start = new Date(viewDate.getFullYear(),viewDate.getMonth(),1-offset,12);
  const grid = $('daysGrid');
  grid.innerHTML = '';

  for (let i=0;i<42;i++) {
    const d = new Date(start);
    d.setDate(start.getDate()+i);
    const key = keyOf(d);
    const list = tasks.filter(t => t.date === key);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'day';
    if (d.getMonth() !== viewDate.getMonth()) b.classList.add('outside');
    if (key === selectedDate) b.classList.add('selected');
    if (key === today) b.classList.add('today');

    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = d.getDate();
    b.appendChild(num);

    if (list.length) {
      const dots = document.createElement('div');
      dots.className = 'dots';
      list.slice(0,4).forEach(t => {
        const dot = document.createElement('span');
        dot.className = 'dot' + (t.done ? ' done-dot' : '');
        dots.appendChild(dot);
      });
      b.appendChild(dots);
    }
    b.addEventListener('click', () => {
      selectedDate = key;
      viewDate = new Date(d.getFullYear(),d.getMonth(),1);
      renderAll();
    });
    grid.appendChild(b);
  }
}
function renderTasks() {
  const d = parseDate(selectedDate);
  const list = tasks.filter(t => t.date === selectedDate)
    .sort((a,b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
  $('selectedTitle').textContent = selectedDate === today
    ? 'Планы на сегодня' : `${d.getDate()} ${months[d.getMonth()].toLowerCase()}`;
  $('selectedSubtitle').textContent =
    `${weekdays[d.getDay()]}, задач: ${list.length}`;

  const root = $('taskList');
  root.innerHTML = '';
  if (!list.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = '<div style="font-size:28px">✦</div><strong>Пока планов нет</strong><span>Добавь первую задачу на этот день</span>';
    root.appendChild(empty);
    return;
  }

  list.forEach(t => {
    const item = document.createElement('div');
    item.className = 'task' + (t.done ? ' done' : '');
    const check = document.createElement('input');
    check.type = 'checkbox';
    check.checked = !!t.done;
    check.addEventListener('change', () => {
      t.done = check.checked; save(); renderAll();
    });

    const main = document.createElement('div');
    main.className = 'task-main';
    const title = document.createElement('div');
    title.className = 'task-title';
    title.textContent = t.title;
    main.appendChild(title);

    const metaText = [];
    if (t.time) metaText.push('◷ ' + t.time);
    if (t.reminder) metaText.push('🔔 Напоминание включено');
    if (t.note) metaText.push(t.note);
    if (metaText.length) {
      const meta = document.createElement('div');
      meta.className = 'task-meta';
      meta.textContent = metaText.join('\n');
      main.appendChild(meta);
    }

    const actions = document.createElement('div');
    actions.className = 'task-actions';
    const edit = document.createElement('button');
    edit.className = 'mini-btn';
    edit.textContent = '✎';
    edit.title = 'Изменить';
    edit.addEventListener('click', () => openModal(t.id));

    const del = document.createElement('button');
    del.className = 'mini-btn';
    del.textContent = '×';
    del.title = 'Удалить';
    del.addEventListener('click', () => {
      if (confirm('Удалить эту задачу?')) {
        tasks = tasks.filter(x => x.id !== t.id);
        save(); renderAll(); toast('Задача удалена');
      }
    });
    actions.append(edit,del);
    item.append(check,main,actions);
    root.appendChild(item);
  });
}
function renderAll() { renderCalendar(); renderTasks(); }
  
let ideas = [];
let editingIdeaId = null;
let ideaImages = [];

try {
  ideas = JSON.parse(localStorage.getItem('daybook_ideas') || '[]');
  if (!Array.isArray(ideas)) ideas = [];
} catch {
  ideas = [];
}

function saveIdeas() {
  try {
    localStorage.setItem('daybook_ideas', JSON.stringify(ideas));
    return true;
  } catch {
    toast('Недостаточно места. Удали большие фотографии и попробуй снова.');
    return false;
  }
}

function showPage(page) {
  const isIdeas = page === 'ideas';
  $('ideasPage').style.display = isIdeas ? 'block' : 'none';
  document.querySelector('.layout').style.display = isIdeas ? 'none' : 'grid';
  $('newTaskTop').style.display = isIdeas ? 'none' : '';
  if (isIdeas) renderIdeas();
}

function renderIdeas() {
  const root = $('ideasList');
  root.replaceChildren();

  if (!ideas.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Пока идей нет. Нажми «Новая идея», чтобы добавить первую.';
    root.appendChild(empty);
    return;
  }

  ideas.forEach(idea => {
    const card = document.createElement('article');
    card.style.cssText = 'border:1px solid var(--line);border-radius:13px;padding:14px;min-width:0;';

    const title = document.createElement('h3');
    title.textContent = idea.title || 'Без названия';

    const body = document.createElement('p');
    body.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;';
    body.textContent = idea.text || '';

    card.append(title, body);

    (idea.images || []).forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      img.alt = 'Изображение идеи';
      img.style.cssText = 'width:100%;max-height:240px;object-fit:contain;border-radius:9px;margin-top:8px;';
      card.appendChild(img);
    });

    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex;gap:8px;margin-top:12px;';

    const edit = document.createElement('button');
    edit.type = 'button';
    edit.textContent = '✏️ Изменить';
    edit.addEventListener('click', () => openIdeaEditor(idea.id));

    const del = document.createElement('button');
    del.type = 'button';
    del.textContent = '🗑️ Удалить';
    del.addEventListener('click', () => {
      if (confirm('Удалить эту идею?')) {
        ideas = ideas.filter(item => item.id !== idea.id);
        if (saveIdeas()) {
          renderIdeas();
          toast('Идея удалена');
        }
      }
    });

    actions.append(edit, del);
    card.appendChild(actions);
    root.appendChild(card);
  });
}

function openIdeaEditor(id = null) {
  editingIdeaId = id;
  const idea = id ? ideas.find(item => item.id === id) : null;

  $('ideaEditorTitle').textContent = idea ? 'Изменить идею' : 'Новая идея';
  $('ideaTitle').value = idea?.title || '';
  $('ideaText').value = idea?.text || '';
  ideaImages = [...(idea?.images || [])];
  $('ideaImageInput').value = '';
  $('ideaDrawingArea').style.display = 'none';
  renderIdeaImages();
  $('ideaEditor').style.display = 'block';
  $('ideaTitle').focus();
}

function renderIdeaImages() {
  const root = $('ideaImagesPreview');
  root.replaceChildren();

  ideaImages.forEach((src, index) => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'width:100px;';

    const img = document.createElement('img');
    img.src = src;
    img.alt = 'Фото идеи';
    img.style.cssText = 'width:100px;height:90px;object-fit:cover;border-radius:8px;';

    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = 'Удалить';
    remove.addEventListener('click', () => {
      ideaImages.splice(index, 1);
      renderIdeaImages();
    });

    wrap.append(img, remove);
    root.appendChild(wrap);
  });
}

$('addIdeaButton').addEventListener('click', () => openIdeaEditor());

$('cancelIdeaButton').addEventListener('click', () => {
  $('ideaEditor').style.display = 'none';
  editingIdeaId = null;
  ideaImages = [];
});

$('ideaImageInput').addEventListener('change', async event => {
  const files = Array.from(event.target.files || []);
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    if (file.size > 12 * 1024 * 1024) {
      toast('Фото слишком большое. Выбери файл меньше 12 МБ.');
      continue;
    }

    try {
      const data = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const image = await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = data;
      });

      const scale = Math.min(1, 1000 / Math.max(image.width, image.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(image.width * scale));
      canvas.height = Math.max(1, Math.round(image.height * scale));

      const ctx = canvas.getContext('2d');
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      ideaImages.push(canvas.toDataURL('image/jpeg', 0.75));
    } catch {
      toast('Не удалось загрузить одно из фото');
    }
  }

  renderIdeaImages();
  event.target.value = '';
});

$('saveIdeaButton').addEventListener('click', () => {
  const title = $('ideaTitle').value.trim();
  const text = $('ideaText').value.trim();

  if (!title && !text && !ideaImages.length) {
    toast('Добавь название, текст или фотографию');
    return;
  }

  const previous = editingIdeaId
    ? ideas.find(item => item.id === editingIdeaId)
    : null;

  const idea = {
    id: editingIdeaId || (Date.now().toString() + Math.random()),
    title,
    text,
    images: [...ideaImages],
    createdAt: previous?.createdAt || new Date().toISOString()
  };

  const oldIdeas = [...ideas];

  if (editingIdeaId) {
    ideas = ideas.map(item => item.id === editingIdeaId ? idea : item);
  } else {
    ideas.unshift(idea);
  }

  if (!saveIdeas()) {
    ideas = oldIdeas;
    return;
  }

  $('ideaEditor').style.display = 'none';
  editingIdeaId = null;
  ideaImages = [];
  renderIdeas();
  toast('Идея сохранена');
});

// Рисование пальцем или мышкой
const ideaCanvas = $('ideaCanvas');
const ideaCtx = ideaCanvas.getContext('2d');
let drawing = false;

ideaCtx.lineWidth = 3;
ideaCtx.lineCap = 'round';
ideaCtx.lineJoin = 'round';
ideaCtx.strokeStyle = '#182033';

ideaCanvas.addEventListener('pointerdown', event => {
  drawing = true;
  ideaCanvas.setPointerCapture(event.pointerId);
  const rect = ideaCanvas.getBoundingClientRect();
  ideaCtx.beginPath();
  ideaCtx.moveTo(
    (event.clientX - rect.left) * ideaCanvas.width / rect.width,
    (event.clientY - rect.top) * ideaCanvas.height / rect.height
  );
});

ideaCanvas.addEventListener('pointermove', event => {
  if (!drawing) return;
  const rect = ideaCanvas.getBoundingClientRect();
  ideaCtx.lineTo(
    (event.clientX - rect.left) * ideaCanvas.width / rect.width,
    (event.clientY - rect.top) * ideaCanvas.height / rect.height
  );
  ideaCtx.stroke();
});

function stopIdeaDrawing() {
  drawing = false;
  ideaCtx.beginPath();
}

ideaCanvas.addEventListener('pointerup', stopIdeaDrawing);
ideaCanvas.addEventListener('pointercancel', stopIdeaDrawing);

$('drawIdeaButton').addEventListener('click', () => {
  $('ideaDrawingArea').style.display = 'block';
});

$('clearIdeaDrawing').addEventListener('click', () => {
  ideaCtx.clearRect(0, 0, ideaCanvas.width, ideaCanvas.height);
});

$('saveIdeaDrawing').addEventListener('click', () => {
  const pixels = ideaCtx.getImageData(0, 0, ideaCanvas.width, ideaCanvas.height).data;
  let hasDrawing = false;

  for (let i = 3; i < pixels.length; i += 4) {
    if (pixels[i] !== 0) {
      hasDrawing = true;
      break;
    }
  }

  if (!hasDrawing) {
    toast('Сначала нарисуй что-нибудь');
    return;
  }

  ideaImages.push(ideaCanvas.toDataURL('image/png'));
  renderIdeaImages();
  ideaCtx.clearRect(0, 0, ideaCanvas.width, ideaCanvas.height);
  $('ideaDrawingArea').style.display = 'none';
  toast('Рисунок добавлен к идее');
});

  
$('menuButton').addEventListener('click', () => {
  $('sideMenu').classList.toggle('open');
});

document.addEventListener('click', (e) => {
  if (!$('sideMenu').contains(e.target) &&
      e.target !== $('menuButton')) {
    $('sideMenu').classList.remove('open');
  }
});


$('homePageButton').addEventListener('click', () => {
  $('sideMenu').classList.remove('open');
  showPage('home');
});

$('ideasPageButton').addEventListener('click', () => {
  $('sideMenu').classList.remove('open');
  showPage('ideas');
});


$('ideasPageButton').addEventListener('click', () => {
  $('sideMenu').classList.remove('open');
  toast('Страницу «Идеи» добавим следующим шагом');
});


function openModal(id=null) {
  editingId = id;
  const t = id ? tasks.find(x => x.id === id) : null;
  $('modalTitle').textContent = t ? 'Изменить задачу' : 'Новая задача';
  $('taskName').value = t?.title || '';
  $('taskDate').value = t?.date || selectedDate;
  $('taskTime').value = t?.time || '';
  $('taskNote').value = t?.note || '';
  $('taskReminder').checked = !!t?.reminder;
  $('taskOverlay').classList.add('show');
  setTimeout(() => $('taskName').focus(),50);
}
function closeModal() {
  $('taskOverlay').classList.remove('show');
  editingId = null;
}
$('newTaskTop').addEventListener('click', () => openModal());
$('addTask').addEventListener('click', () => openModal());
$('closeModal').addEventListener('click', closeModal);
$('cancelModal').addEventListener('click', closeModal);
$('taskOverlay').addEventListener('click', e => {
  if (e.target === $('taskOverlay')) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
$('prevMonth').addEventListener('click', () => {
  viewDate = new Date(viewDate.getFullYear(),viewDate.getMonth()-1,1);
  renderCalendar();
});
$('nextMonth').addEventListener('click', () => {
  viewDate = new Date(viewDate.getFullYear(),viewDate.getMonth()+1,1);
  renderCalendar();
});
$('todayBtn').addEventListener('click', () => {
  selectedDate = today;
  viewDate = new Date();
  renderAll();
});

$('taskForm').addEventListener('submit', async e => {
  e.preventDefault();
  const title = $('taskName').value.trim();
  const date = $('taskDate').value;
  const time = $('taskTime').value;
  const note = $('taskNote').value.trim();
  const reminder = $('taskReminder').checked;
  if (!title || !date) return;

  if (reminder && 'Notification' in window &&
      Notification.permission === 'default') {
    try { await Notification.requestPermission(); } catch {}
  }
  if (reminder && (!('Notification' in window) ||
      Notification.permission !== 'granted')) {
    toast('Задача сохранена, но уведомления не разрешены');
  }

  const wasEditing = !!editingId;
  if (editingId) {
    const t = tasks.find(x => x.id === editingId);
    if (t) Object.assign(t,{title,date,time,note,reminder});
  } else {
    tasks.push({
      id: Date.now().toString() + Math.random(),
      title,date,time,note,reminder,done:false
    });
  }
  selectedDate = date;
  viewDate = parseDate(date);
  save(); closeModal(); renderAll();
  if (!reminder) toast(wasEditing ? 'Изменения сохранены' : 'Задача добавлена');
});

function checkReminders() {
  if (!('Notification' in window) ||
      Notification.permission !== 'granted') return;
  const now = new Date();
  const stamp = keyOf(now) + 'T' + pad(now.getHours()) + ':' + pad(now.getMinutes());
  tasks.forEach(t => {
    if (t.reminder && !t.done && t.date + 'T' + t.time === stamp) {
      const key = 'daybook_notified_' + t.id + '_' + stamp;
      if (!sessionStorage.getItem(key)) {
        new Notification('Daybook: напоминание',{body:t.title});
        sessionStorage.setItem(key,'1');
      }
    }
  });
}
setInterval(checkReminders,15000);
renderAll();
</script>

    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("Daybook: офлайн-режим подключён"))
      .catch((error) => console.error("Ошибка Service Worker:", error));
  });
}
</script>
